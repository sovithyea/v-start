# The guarantees in CLAUDE.md, on every PR: what ships reaches other people's machines.
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  guarantees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 1. the plugin is valid
        run: npx --yes @anthropic-ai/claude-code@2.1.318 plugin validate .
      - name: 2 to 5. placeholders, licenses, installs, private context
        run: bash tools/check.sh
      - name: each check still catches its fault
        run: bash tools/check-faults.sh

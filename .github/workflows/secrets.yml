# Fails the PR if a key or token is committed. Secrets live in environment config only.
name: secrets
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: scan history for secrets
        run: |
          # Verify the download against the release's published checksums before running it.
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_8.30.1_checksums.txt" | grep ' gitleaks_8.30.1_linux_x64.tar.gz$' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --verbose
